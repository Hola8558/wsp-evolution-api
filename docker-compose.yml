services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    ports:
      - "3232:8080"
    environment:
      - SERVER_URL=http://localhost:3232
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=TlakaniSuperSecreto2026
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://admin:password123@postgres-db:5432/evolution_db
      - CACHE_REDIS_ENABLED=false
      - CACHE_REDIS_URI=redis://redis-db:6379/1
    depends_on:
      - postgres-db
      - redis-db

  postgres-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=evolution_db
    ports:
      - "5433:5432"

  redis-db:
    image: redis:alpine
    ports:
      - "6379:6379"